
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11100f">
  <title>Литературное Таро</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 20%, #30251d, #171411 48%, #0d0c0b);
      color: #e8dfce;
      font-family: Georgia, serif;
      padding: 35px 18px;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: auto;
      text-align: center;
    }

    h1 {
      color: #d0ae70;
      font-size: clamp(30px, 7vw, 44px);
      font-weight: normal;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #b3a38c;
      line-height: 1.7;
    }

    .ornament {
      color: #a0804e;
      font-size: 27px;
      margin: 30px 0;
    }

    #status {
      color: #d0ae70;
      margin: 25px 0;
      min-height: 24px;
    }

    #login {
      margin: 25px auto;
      min-height: 44px;
    }

    .deck {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      max-width: 570px;
      margin: 35px auto;
    }

    .card-back {
      aspect-ratio: 2/3;
      border: 1px solid #a0804e;
      border-radius: 5px;
      background: #211811 url("/images/рубашка.jpg") center/cover no-repeat;
      cursor: pointer;
    }

    .card-back:hover {
      transform: translateY(-8px);
    }

    .card-back:disabled {
      opacity: .5;
      cursor: default;
    }

    #result {
      display: none;
      margin: 35px auto;
      max-width: 540px;
      padding: 22px;
      border: 1px solid #8d7047;
      background: rgba(27,24,20,.92);
    }

    #result img {
      display: block;
      width: 100%;
      max-height: 490px;
      object-fit: contain;
      margin: 0 auto 24px;
    }

    #result h2 {
      color: #d8b878;
      font-weight: normal;
    }

    #result .title {
      color: #b99a67;
      font-style: italic;
    }

    #result .prediction {
      font-size: 17px;
      line-height: 1.8;
      text-align: left;
    }

    .copy-button {
      margin-top: 25px;
      padding: 13px 25px;
      background: #8d7047;
      color: white;
      border: 0;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    @media (max-width: 420px) {
      .deck { gap: 8px; }
      #result { padding: 14px; }
    }
  </style>
</head>

<body>
<main>
  <h1>Литературное Таро</h1>

  <p class="subtitle">
    Астрологи объявили литературный прогноз на неделю.
  </p>

  <div class="ornament">✦ ❖ ✦</div>

  <p id="status">Проверяем связь с литературными звёздами...</p>

  <div id="login"></div>

  <section class="deck" id="deck" hidden>
    <button class="card-back" type="button" aria-label="Первая карта"></button>
    <button class="card-back" type="button" aria-label="Вторая карта"></button>
    <button class="card-back" type="button" aria-label="Третья карта"></button>
  </section>

  <section id="result">
    <img id="card-image" alt="">
    <h2 id="name"></h2>
    <p class="title" id="title"></p>
    <p class="prediction" id="prediction"></p>
    <button class="copy-button" id="copy-button" type="button">
      Скопировать предсказание
    </button>
  </section>
</main>

<script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>

<script>
const status = document.getElementById("status");
const login = document.getElementById("login");
const deck = document.getElementById("deck");
const buttons = document.querySelectorAll(".card-back");

let selectedCard = null;
let cards = [];

function vkError(error) {
  console.error("VK ID error:", error);
  status.textContent = "Не удалось выполнить вход через ВКонтакте.";
}

function vkSuccess(data) {
  console.log("VK ID token response:", data);

  status.textContent =
    "Ответ VK ID получен. Серверная проверка ещё не подключена.";

  login.style.display = "none";
}

function initVK() {
  try {
    if (!window.VKIDSDK) {
      throw new Error("VK ID SDK не загружен");
    }

    if (!window.crypto || !crypto.getRandomValues) {
      throw new Error("Недоступен генератор случайных чисел");
    }

    const VKID = window.VKIDSDK;

    const codeVerifier = Array.from(
      crypto.getRandomValues(new Uint8Array(32)),
      byte => byte.toString(16).padStart(2, "0")
    ).join("");

    const state = crypto.randomUUID();

    VKID.Config.init({
      app: 54910638,
      redirectUrl: "https://literary-tarot.drowweb10.workers.dev/auth/callback",
      state: state,
      codeVerifier: codeVerifier,
      responseMode: VKID.ConfigResponseMode.Callback,
      source: VKID.ConfigSource.LOWCODE,
      scope: ""
    });

    const oneTap = new VKID.OneTap();

    oneTap.render({
      container: login,
      showAlternativeLogin: true
    })
    .on(VKID.WidgetEvents.ERROR, vkError)
    .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, payload => {
      VKID.Auth.exchangeCode(
        payload.code,
        payload.device_id,
        codeVerifier
      )
      .then(vkSuccess)
      .catch(vkError);
    });

  } catch (error) {
    console.error("VK ID initialization error:", error);
    status.textContent =
      "Не удалось запустить авторизацию VK ID.";
  }
}

async function loadCards() {
  try {
    const response = await fetch("/api/cards");

    if (!response.ok) {
      throw new Error("Ошибка загрузки колоды");
    }

    cards = await response.json();

    if (!Array.isArray(cards) || cards.length === 0) {
      throw new Error("В колоде нет активных карт");
    }

  } catch (error) {
    console.error(error);
    status.textContent = "Не удалось загрузить колоду.";
  }
}

function showCard(card) {
  selectedCard = card;
  deck.hidden = true;

  status.textContent =
    "Литературные звёзды сделали свой выбор!";

  document.getElementById("name").textContent = card.name;
  document.getElementById("title").textContent =
    "«" + card.title + "»";

  document.getElementById("prediction").textContent =
    card.prediction;

  const image = document.getElementById("card-image");

  image.style.display = "block";
  image.src = "/images/" + encodeURIComponent(card.image);
  image.alt = card.name;

  image.onerror = () => {
    image.style.display = "none";
    console.error("Ошибка загрузки изображения:", card.image);
  };

  document.getElementById("result").style.display = "block";
}

buttons.forEach(button => {
  button.addEventListener("click", () => {
    if (selectedCard || !cards.length) return;

    buttons.forEach(item => item.disabled = true);

    const card = cards[
      Math.floor(Math.random() * cards.length)
    ];

    showCard(card);
  });
});

document.getElementById("copy-button")
  .addEventListener("click", async () => {
    if (!selectedCard) return;

    const text =
      "Литературное Таро\n" +
      selectedCard.name +
      " — «" + selectedCard.title + "»\n\n" +
      selectedCard.prediction;

    try {
      await navigator.clipboard.writeText(text);

      document.getElementById("copy-button").textContent =
        "Скопировано!";

    } catch (error) {
      console.error(error);

      document.getElementById("copy-button").textContent =
        "Не удалось скопировать";
    }
  });

loadCards();
initVK();
</script>
</body>
</html>
